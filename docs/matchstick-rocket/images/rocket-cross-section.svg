<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320" role="img" aria-labelledby="title desc">
  <title id="title">Matchstick Rocket Cross-Section Concept</title>
  <desc id="desc">Conceptual cross-section for safe educational documentation.</desc>
  <rect x="0" y="0" width="720" height="320" fill="#f5f7fa"/>

  <circle cx="250" cy="160" r="95" fill="#d58e48" stroke="#7a4a22" stroke-width="3"/>
  <circle cx="250" cy="160" r="18" fill="#f3d8b1" stroke="#7a4a22" stroke-width="2"/>
  <line x1="155" y1="160" x2="345" y2="160" stroke="#24415f" stroke-width="2" stroke-dasharray="7 6"/>
  <line x1="250" y1="65" x2="250" y2="255" stroke="#24415f" stroke-width="2" stroke-dasharray="7 6"/>

  <line x1="155" y1="48" x2="345" y2="48" stroke="#24415f" stroke-width="2"/>
  <line x1="155" y1="42" x2="155" y2="54" stroke="#24415f" stroke-width="2"/>
  <line x1="345" y1="42" x2="345" y2="54" stroke="#24415f" stroke-width="2"/>
  <text x="250" y="34" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1f2a38">Outer Diameter: 3 mm</text>

  <line x1="450" y1="110" x2="290" y2="95" stroke="#24415f" stroke-width="2"/>
  <text x="465" y="114" font-family="Georgia, serif" font-size="16" fill="#1f2a38">Outer shell (assumed)</text>

  <line x1="450" y1="175" x2="268" y2="160" stroke="#24415f" stroke-width="2"/>
  <text x="465" y="180" font-family="Georgia, serif" font-size="16" fill="#1f2a38">Inner zone (conceptual)</text>

  <text x="360" y="275" font-family="Georgia, serif" font-size="15" fill="#3b4452">Diagram is illustrative and not a fabrication or test specification.</text>
</svg>
