  <line x1="750" y1="56" x2="750" y2="68" stroke="#2f4f6f" stroke-width="2"/>
  <text x="465" y="48" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#1f2a38">Assumed Length: 100 mm</text>

  <line x1="150" y1="87" x2="150" y2="133" stroke="#2f4f6f" stroke-width="2"/>
