[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fissionwatch"
version = "0.1.0"
description = "Detect and monitor software chain reactions (fission modes) via graph theory, spectral analysis and telemetry"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "networkx>=3.0"]

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.24"]

[project.scripts]
fissionwatch = "fissionwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]